name: Keep Render services awake

# Renderの無料プランは非アクセス時に自動休止し、次のリクエストで起き上がるまで
# 30秒以上かかる。urara-adminはSupabaseのSend Email Hook(5秒でタイムアウト)から
# 直接呼ばれるため、休止していると認証コード送信そのものが失敗する。恒久的な
# 対策はRenderの有料プランへの移行だが、それまでの一時しのぎとして定期的に
# アクセスし、休止させない。
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping urara-admin
        run: curl -fsS --max-time 55 https://urara-admin.onrender.com/login -o /dev/null
      - name: Ping urara-app
        run: curl -fsS --max-time 55 https://urara-app.onrender.com/ -o /dev/null

services:
  - type: web
    name: urara-admin
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=apps/admin
    startCommand: npm run start --workspace=apps/admin
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_FROM_ADDRESS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true

  - type: web
    name: urara-app
    runtime: static
    buildCommand: npm install && npm run build:web --workspace=apps/mobile
    staticPublishPath: apps/mobile/dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: EXPO_PUBLIC_GOOGLE_PLACES_API_KEY
        sync: false
      - key: EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

services:
  - type: web
    name: urara-admin
    env: node
    plan: free
    buildCommand: npm install && npm run build --workspace=apps/admin
    startCommand: npm run start --workspace=apps/admin
    envVars:
      # @supabase/supabase-jsが内部で使うWebSocket機能はNode 22以降で
      # ネイティブ対応。20.xだとビルド/実行時にエラーになる。
      - key: NODE_VERSION
        value: 22.11.0
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_FROM_ADDRESS
        sync: false
      - key: OPERATOR_NOTIFY_EMAIL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_USERNAME_2
        sync: false
      - key: ADMIN_PASSWORD_2
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: EMAIL_VERIFICATION_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_AUTH_HOOK_SECRET
        sync: false

  - type: web
    name: urara-app
    runtime: static
    buildCommand: npm install && npm run build:web --workspace=apps/mobile
    staticPublishPath: apps/mobile/dist
    envVars:
      # @supabase/supabase-jsが内部で使うWebSocket機能はNode 22以降で
      # ネイティブ対応。20.xだとexpo exportのビルドが失敗する。
      - key: NODE_VERSION
        value: 22.11.0
      - key: EXPO_PUBLIC_GOOGLE_PLACES_API_KEY
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_URL
        sync: false
      - key: EXPO_PUBLIC_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
